services:
  - type: web_service
    name: openwa
    env: docker
    plan: free
    branch: main
    dockerfilePath: Dockerfile
    internalPort: 2785
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "2785"
      - key: ENABLE_SWAGGER
        value: "true"
    healthCheckPath: /api/health/ready
